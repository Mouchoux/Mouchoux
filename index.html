<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un petit truc pour toi</title>
<style>
:root{
  --creme:#fff5f1; --rose:#f6c3cc; --rose-d:#e98fa2; --rouge:#c4475f; --bordeaux:#4a1c2b;
  --or:#d4a257; --or-c:#f1d8a4; --encre:#3b1a25; --doux:#8a5b68;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--encre);
  background:radial-gradient(ellipse at 15% 10%,#ffe3e6 0,transparent 55%),radial-gradient(ellipse at 90% 90%,#f9dcc0 0,transparent 50%),linear-gradient(160deg,var(--creme),#fbe3e4);
  background-attachment:fixed;display:flex;flex-direction:column;align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#adminBtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:5;width:34px;height:34px;border:0;border-radius:50%;
  background:rgba(255,255,255,.5);color:var(--doux);opacity:.45;cursor:pointer;display:grid;place-items:center;transition:opacity .3s}
#adminBtn:hover,#adminBtn:focus-visible{opacity:1}
#adminBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
main{position:relative;z-index:1;width:100%;max-width:640px;flex:1;display:flex;flex-direction:column;justify-content:center;padding:46px 0 10px;perspective:1400px}
.card{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,240,240,.78));
  border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:clamp(26px,5vw,46px);
  box-shadow:0 1px 0 #fff inset,0 30px 60px -25px rgba(196,71,95,.35),0 12px 24px -12px rgba(74,28,43,.15);
  transform-style:preserve-3d;transition:transform .25s ease-out;animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 48%,transparent 60%);opacity:.5}
.card::after{content:"";position:absolute;left:28px;right:28px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--or),transparent)}
@keyframes enter{from{opacity:0;transform:translateY(24px) rotateX(10deg)}to{opacity:1}}
h1,h2{font-family:var(--serif);font-weight:500;color:var(--bordeaux);letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(2.2rem,7vw,3.2rem);font-style:italic;margin-bottom:18px}
h2{font-size:clamp(1.45rem,4.6vw,2rem);margin-bottom:24px}
p.t{font-family:var(--serif);font-size:1.08rem;line-height:1.7;margin-bottom:14px;max-width:52ch}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.btn{font:inherit;font-size:1rem;padding:14px 20px;border-radius:16px;border:1px solid rgba(196,71,95,.25);cursor:pointer;color:var(--bordeaux);
  background:linear-gradient(180deg,#fff,#ffeceb);box-shadow:0 6px 0 -2px rgba(196,71,95,.18),0 14px 22px -10px rgba(196,71,95,.3);
  transition:transform .25s,box-shadow .25s,background .25s;transform-style:preserve-3d;text-align:left}
.btn:hover:not(:disabled){transform:perspective(600px) translateY(-3px) rotateX(10deg) scale(1.02);box-shadow:0 12px 0 -4px rgba(196,71,95,.15),0 22px 30px -10px rgba(196,71,95,.4)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.btn.main{color:#fff;border-color:transparent;text-align:center;background:linear-gradient(135deg,#d9566f,var(--rouge) 55%,#a93450)}
.btn.main:disabled{opacity:.5}
.btn.sel{color:#fff;border-color:transparent;background:linear-gradient(135deg,#d9566f,var(--rouge))}
.btn:disabled:not(.sel){opacity:.45;cursor:default}
.btn.sel:disabled{cursor:default}
.btn.ghost{background:transparent;box-shadow:none;border-color:rgba(74,28,43,.2)}
.react{min-height:1.6em;margin-top:22px;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--rouge);animation:enter .6s both}
.note{font-size:.85rem;color:var(--doux);margin-top:12px}
.msg{font-size:.9rem;color:var(--rouge);margin-top:10px;min-height:1.2em}
.prog{width:100%;max-width:640px;position:relative;z-index:1;margin-top:8px;padding-top:26px}
.prog .bar{height:6px;border-radius:6px;background:rgba(196,71,95,.15);overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--rose-d),var(--rouge),var(--or));border-radius:6px;transition:width .8s cubic-bezier(.3,.8,.3,1)}
.prog .heart{position:absolute;top:0;left:0;font-size:20px;color:var(--rouge);transition:left .8s cubic-bezier(.3,.8,.3,1);transform:translateX(-50%)}
.prog .heart span{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.prog .cnt{font-size:.8rem;color:var(--doux);margin-top:8px;text-align:right}
.precis{margin-top:24px;padding-top:18px;border-top:1px dashed rgba(196,71,95,.25)}
label.l{display:block;font-size:.88rem;color:var(--doux);margin-bottom:8px}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1px solid rgba(196,71,95,.25);background:rgba(255,255,255,.85);color:var(--encre);resize:vertical}
textarea:disabled{opacity:.6}
textarea.big{min-height:130px}
input[type=range]{width:100%;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--or-c));margin:22px 0 8px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--rose-d) 50%,var(--rouge));box-shadow:0 4px 10px rgba(196,71,95,.45);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:var(--rouge);box-shadow:0 4px 10px rgba(196,71,95,.45)}
input[type=range]:disabled{opacity:.6}
.ends{display:flex;justify-content:space-between;font-size:.9rem;color:var(--doux);gap:10px}
.cur{text-align:center;font-family:var(--serif);font-size:1.25rem;color:var(--rouge);min-height:1.6em;margin-top:6px}
.modal{position:fixed;inset:0;z-index:10;background:rgba(74,28,43,.4);backdrop-filter:blur(6px);display:none;place-items:center;padding:18px}
.modal.on{display:grid}
.modal .card{max-width:360px;width:100%;padding:28px}
.admin{width:100%;max-width:1000px;position:relative;z-index:1;margin-top:40px}
.admin h1{font-size:2rem;font-style:normal}
.tw{overflow-x:auto;margin-top:18px;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid rgba(196,71,95,.15)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(196,71,95,.12);vertical-align:top}
th{background:rgba(246,195,204,.4);font-weight:600;color:var(--bordeaux)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="adminBtn" aria-label="Accès administrateur" title="Admin">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
</button>

<main id="app"></main>

<div class="prog hide" id="prog">
  <div class="heart" id="heart"><span>&#10084;</span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="cnt" id="cnt"></div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2 style="font-size:1.4rem;margin-bottom:14px">Accès administrateur</h2>
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="off">
    <div class="msg" id="pwMsg"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn main" id="pwOk">Entrer</button>
      <button class="btn ghost" id="pwNo">Annuler</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
// >>> Pour changer le mot de passe admin, modifiez la ligne ci-dessous <<<
const MOT_DE_PASSE_ADMIN = "admin123";
// >>> Base de données en ligne (Firebase) : colle ici l'URL de ta Realtime Database, sans "/" final.
// Exemple : "https://mon-projet-default-rtdb.europe-west1.firebasedatabase.app"
// Laissée vide, les réponses restent sur l'appareil de la personne.
const URL_BASE = "https://mouchoux-1164d-default-rtdb.europe-west1.firebasedatabase.app";
const distant = !!URL_BASE;
const CLE_REPONSES = "qq_reponses";
const CLE_FLAG = "aDejaRepondu";

/* ============ QUESTIONS ============ */
// type "b" = boutons, "s" = slider, "t" = texte libre
const QUESTIONS = [
 {t:"b",q:"Quand tu penses à moi, ça te fait quoi ?",o:["Ça me fait sourire","Ça me rend curieuse","Rien de spécial pour l'instant","Ça dépend des jours"]},
 {t:"b",q:"Comment tu me décrirais en un mot ?",o:["Drôle","Gentil","Mystérieux","Pas encore sûre"]},
 {t:"s",q:"Entre nous, tu dirais que c'est plutôt…",a:"Pas spécialement",b:"Carrément",pal:["Pas spécialement","Un peu","Plutôt oui","Vraiment","Carrément"],suite:"une belle complicité"},
 {t:"b",q:"Qu'est-ce que tu apprécies le plus chez moi ?",o:["Mon humour","Ma gentillesse","Ma façon de parler","Ma simplicité"]},
 {t:"b",q:"Quand on discute, tu te sens…",o:["À l'aise","Un peu intimidée","Détendue","Ça dépend du sujet"]},
 {t:"b",q:"Tu dirais que je suis quelqu'un de…",o:["Rassurant","Surprenant","Attentionné","Encore à découvrir"]},
 {t:"b",q:"Ce qui te plaît le plus dans nos échanges, c'est…",o:["Les fous rires","Les vraies discussions","Le fait qu'on se découvre","Le naturel"]},
 {t:"b",q:"Si tu devais me décrire à une amie, tu dirais…",o:["Quelqu'un de sympa","Quelqu'un de drôle","Quelqu'un de bien","Je ne sais pas encore"]},
 {t:"s",q:"Tu as l'impression qu'on se comprend ?",a:"Pas encore",b:"Totalement",pal:["Pas encore","Un peu","Assez bien","Beaucoup","Totalement"]},
 {t:"b",q:"Quand je te propose quelque chose, tu te dis…",o:["Pourquoi pas !","J'ai besoin d'y réfléchir","Ça dépend de quoi","Je suis curieuse"]},
 {t:"s",q:"Tu aimerais qu'on se voie plus souvent ?",a:"Pas spécialement",b:"Carrément",pal:["Pas spécialement","Peut-être","Pourquoi pas","Oui, volontiers","Carrément"]},
 {t:"b",q:"Ce que tu aimerais qu'on partage en plus, ce serait…",o:["Plus de discussions","Une sortie tranquille","Un moment autour d'un café","Rien de plus, ça me va"]},
 {t:"b",q:"Qu'est-ce qui pourrait rendre nos échanges encore mieux, selon toi ?",o:["Plus de spontanéité","Plus de temps","Plus de légèreté","Rien, c'est déjà bien"]},
 {t:"b",q:"Tu dirais que je suis quelqu'un qui…",o:["Te met à l'aise","Te fait rire","Te donne envie d'en savoir plus","Te laisse encore perplexe"]},
 {t:"t",q:"Une petite chose que tu aimerais que je sois ?",note:"Attention : ça ne veut pas dire que je vais l'être, c'est juste pour savoir ce que tu veux."}
];
const OUI=["Merci d'avoir accepté.","Cool, merci à toi !","Merci, ça me fait plaisir.","Super, ça me touche."];
const NON=["Pas de souci, c'est pas grave.","Pas de problème, à bientôt peut-être.","Aucun souci, belle journée à toi.","Tout va bien, prends ton temps."];

/* ============ BASE LOCALE ============ */
const lire=()=>{try{return JSON.parse(localStorage.getItem(CLE_REPONSES))||[]}catch(e){return []}};
const ecrire=a=>{try{localStorage.setItem(CLE_REPONSES,JSON.stringify(a))}catch(e){}};
async function api(chemin,methode,corps){
  const o={method:methode||"GET"};
  if(corps!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(corps)}
  const r=await fetch(URL_BASE+chemin+".json",o);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
const flag=()=>{try{return localStorage.getItem(CLE_FLAG)==="true"}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
const app=$("app");

/* ============ ÉCRANS ============ */
function carte(html){
  app.innerHTML='<div class="card" id="card">'+html+'</div>';
  const c=$("card");
  // inclinaison 3D douce au survol
  c.onmousemove=e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.transform="rotateY("+(x*5)+"deg) rotateX("+(-y*5)+"deg)"};
  c.onmouseleave=()=>c.style.transform="";
  return c;
}
function accueil(){
  $("prog").classList.add("hide");
  carte('<h1>Coucou,</h1>'+
   '<p class="t">Je m\'ennuyais un peu, du coup je me suis dit que j\'allais venir un petit peu te déranger.</p>'+
   '<p class="t">J\'ai pensé à toi, alors j\'ai créé ce petit truc.</p>'+
   '<p class="t">Si tu as un moment et rien de mieux à faire, tu peux répondre à quelques questions.</p>'+
   '<p class="t">Et si tu n\'as pas envie, aucun souci : tu fermes, et on n\'en parle plus.</p>'+
   '<div class="row"><button class="btn main" id="oui">D\'accord</button><button class="btn" id="non">Pas maintenant</button></div>'+
   '<div class="react" id="react" aria-live="polite"></div>');
  $("oui").onclick=()=>{$("react").textContent=pick(OUI);$("oui").disabled=$("non").disabled=true;setTimeout(()=>question(lire().length),1400)};
  $("non").onclick=()=>{const r=$("react");r.textContent=pick(NON);r.style.animation="none";void r.offsetWidth;r.style.animation=""};
}
function dejaRepondu(){
  $("prog").classList.add("hide");
  carte('<h1>Vous avez déjà répondu</h1><p class="t">Merci encore, tes réponses sont bien enregistrées.</p>');
}
function progression(n){
  $("prog").classList.remove("hide");
  const p=n/QUESTIONS.length*100;
  $("fill").style.width=p+"%";
  $("heart").style.left=Math.min(Math.max(p,3),97)+"%";
  $("cnt").textContent=Math.min(n+1,QUESTIONS.length)+" / "+QUESTIONS.length;
}
function question(i){
  if(i>=QUESTIONS.length) return fin();
  const Q=QUESTIONS[i]; let saved=false, envoi=Promise.resolve(), cle=null, entree=null;
  progression(i);
  let corps='';
  if(Q.t==="b") corps='<div class="opts">'+Q.o.map((o,k)=>'<button class="btn opt" data-k="'+k+'">'+esc(o)+'</button>').join("")+'</div>';
  if(Q.t==="s") corps='<input type="range" id="sl" min="0" max="'+(Q.pal.length-1)+'" value="2" aria-label="'+esc(Q.q)+'"><div class="ends"><span>'+esc(Q.a)+'</span><span>'+esc(Q.b)+'</span></div><div class="cur" id="cur">'+esc(Q.pal[2])+'</div><div class="row"><button class="btn main" id="val">Valider</button></div>';
  if(Q.t==="t") corps='<p class="note" style="margin:-10px 0 14px">'+esc(Q.note)+'</p><textarea class="big" id="libre" placeholder="Écris ce que tu veux ici"></textarea><div class="row"><button class="btn main" id="val">Valider</button></div>';
  const prec=Q.t==="t"?'':'<div class="precis"><label class="l" for="prec">Tu veux préciser ? (facultatif)</label><textarea id="prec" rows="2"></textarea></div>';
  carte('<h2>'+esc(Q.q)+'</h2>'+corps+prec+'<div class="msg" id="msg" aria-live="polite"></div><div class="row hide" id="nx"><button class="btn main" id="go">'+(i===QUESTIONS.length-1?'Terminer':'Continuer')+'</button></div>');

  function verrouiller(rep){
    if(saved){$("msg").textContent="Réponse déjà enregistrée.";return}
    saved=true;
    const a=lire();
    entree={numero:i+1,question:Q.q,reponse:rep,precision:"",date:new Date().toISOString()};
    a.push(entree);
    ecrire(a);
    if(distant) envoi=api("/reponses","POST",entree).then(r=>{cle=r.name}).catch(()=>{});
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    ["sl","libre","val"].forEach(id=>{if($(id))$(id).disabled=true});
    $("nx").classList.remove("hide");
    $("go").focus();
  }
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.classList.add("sel");verrouiller(Q.o[b.dataset.k])});
  if(Q.t==="s"){
    $("sl").oninput=()=>$("cur").textContent=Q.pal[$("sl").value];
    $("val").onclick=()=>verrouiller(Q.pal[$("sl").value]);
  }
  if(Q.t==="t") $("val").onclick=()=>{
    const v=$("libre").value.trim();
    if(!v){$("msg").textContent="Écris quelques mots, ou passe si tu préfères ne rien dire.";return}
    verrouiller(v);
  };
  $("go").onclick=async()=>{
    $("go").disabled=true;
    let p="";
    if($("prec")){p=$("prec").value.trim();const a=lire();if(a.length){a[a.length-1].precision=p;ecrire(a)}}
    if(distant&&entree){
      entree.precision=p;
      await envoi;
      try{ if(cle){ if(p) await api("/reponses/"+cle,"PATCH",{precision:p}); } else await api("/reponses","POST",entree); }catch(e){}
    }
    question(i+1);
  };
}
function fin(){
  try{localStorage.setItem(CLE_FLAG,"true")}catch(e){}
  progression(QUESTIONS.length);$("cnt").textContent="Terminé";
  carte('<h1>Merci</h1><p class="t">C\'est tout. Merci d\'avoir pris le temps de répondre, honnêtement, ça me touche.</p><p class="t">Tu peux fermer cette page.</p>');
}

/* ============ ADMIN ============ */
$("adminBtn").onclick=()=>{$("modal").classList.add("on");$("pw").value="";$("pwMsg").textContent="";$("pw").focus()};
$("pwNo").onclick=()=>$("modal").classList.remove("on");
$("pwOk").onclick=entrerAdmin;
$("pw").onkeydown=e=>{if(e.key==="Enter")entrerAdmin();if(e.key==="Escape")$("modal").classList.remove("on")};
function entrerAdmin(){
  if($("pw").value===MOT_DE_PASSE_ADMIN){$("modal").classList.remove("on");pageAdmin()}
  else $("pwMsg").textContent="Mot de passe incorrect";
}
async function pageAdmin(msg){
  $("prog").classList.add("hide");
  app.innerHTML='<div class="admin card" style="max-width:1000px"><h1>Réponses</h1><p class="note">Chargement…</p></div>';
  let a,info;
  if(distant){
    try{
      const d=await api("/reponses");
      a=Object.values(d||{}).sort((x,y)=>new Date(x.date)-new Date(y.date));
      info="Base en ligne : les réponses arrivent depuis l'appareil de la personne.";
    }catch(e){a=lire();info="Connexion à la base impossible : seules les réponses de cet appareil s'affichent.";}
  }else{a=lire();info="Base en ligne non configurée (URL_BASE vide) : seules les réponses de cet appareil s'affichent.";}
  const lignes=a.length?a.map((r,i)=>'<tr><td>'+(r.numero||i+1)+'</td><td>'+esc(r.question)+'</td><td>'+esc(r.reponse)+'</td><td>'+esc(r.precision||"")+'</td><td>'+esc(new Date(r.date).toLocaleString("fr-FR"))+'</td></tr>').join("")
    :'<tr><td colspan="5">Aucune réponse enregistrée.</td></tr>';
  app.innerHTML='<div class="admin card" style="max-width:1000px"><h1>Réponses</h1>'+
   (msg?'<p class="note" style="color:var(--rouge)">'+esc(msg)+'</p>':'')+
   '<p class="note">'+a.length+' réponse(s) · '+esc(info)+'</p>'+
   '<div class="tw"><table><thead><tr><th>N°</th><th>Question</th><th>Réponse</th><th>Précision</th><th>Date</th></tr></thead><tbody>'+lignes+'</tbody></table></div>'+
   '<div class="row"><button class="btn main" id="act">Actualiser</button><button class="btn" id="exp">Exporter en JSON</button><button class="btn" id="rst">Réinitialiser</button><button class="btn ghost" id="ret">Retour au questionnaire</button></div></div>';
  $("act").onclick=()=>pageAdmin();
  $("exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(a,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(blob),l=document.createElement("a");
    l.href=u;l.download="reponses.json";document.body.appendChild(l);l.click();l.remove();URL.revokeObjectURL(u);
  };
  // Confirmation intégrée (la fenêtre confirm() du navigateur est souvent bloquée)
  let attente=false;
  $("rst").onclick=async()=>{
    if(!attente){
      attente=true;
      $("rst").textContent="Confirmer : tout effacer et réactiver";
      $("rst").classList.add("main");
      const nop=document.createElement("button");
      nop.className="btn ghost";nop.textContent="Annuler";
      nop.onclick=()=>pageAdmin();
      $("rst").after(nop);
      return;
    }
    const v=Date.now();
    try{
      if(distant){await api("/reponses","DELETE");await api("/reset","PUT",v);}
    }catch(e){pageAdmin("Échec de la réinitialisation en ligne : vérifie la connexion.");return}
    try{localStorage.removeItem(CLE_REPONSES);localStorage.removeItem(CLE_FLAG);localStorage.setItem("qq_v",String(v))}catch(e){}
    pageAdmin("Questionnaire réinitialisé : il est de nouveau disponible (la personne le retrouvera vierge en rouvrant le lien).");
  };
  $("ret").onclick=demarrer;
}

/* ============ PARTICULES (canvas 2D) ============ */
(function(){
  const cv=$("fx"),ctx=cv.getContext("2d");let W,H,P=[];
  const taille=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};
  addEventListener("resize",taille);taille();
  const coeur=(x,y,s,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+s*.3);
    ctx.bezierCurveTo(x,y-s*.3,x-s,y-s*.3,x-s,y+s*.3);ctx.bezierCurveTo(x-s,y+s*.8,x,y+s*1.1,x,y+s*1.4);
    ctx.bezierCurveTo(x,y+s*1.1,x+s,y+s*.8,x+s,y+s*.3);ctx.bezierCurveTo(x+s,y-s*.3,x,y-s*.3,x,y+s*.3);ctx.fill()};
  const nouveau=()=>({x:Math.random()*W,y:H+20,s:4+Math.random()*7,v:.25+Math.random()*.5,d:Math.random()*6,h:Math.random()<.45,
    c:pick(["rgba(233,143,162,.35)","rgba(196,71,95,.22)","rgba(212,162,87,.4)","rgba(246,195,204,.55)"])});
  for(let i=0;i<22;i++){const p=nouveau();p.y=Math.random()*H;P.push(p)}
  const reduit=matchMedia("(prefers-reduced-motion:reduce)").matches;
  (function boucle(t){
    ctx.clearRect(0,0,W,H);
    P.forEach((p,i)=>{
      if(!reduit){p.y-=p.v;p.x+=Math.sin(t/1500+p.d)*.3}
      if(p.y<-20)P[i]=nouveau();
      if(p.h)coeur(p.x,p.y,p.s,p.c);else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s/2.5,0,7);ctx.fill()}
    });
    requestAnimationFrame(boucle);
  })(0);
})();

/* ============ DÉMARRAGE ============ */
async function demarrer(){
  // Réinitialisation à distance : si l'admin a réinitialisé, on efface l'état local de cet appareil
  if(distant){
    try{
      const v=await api("/reset");
      if(v!==null&&String(v)!==localStorage.getItem("qq_v")){
        localStorage.removeItem(CLE_REPONSES);localStorage.removeItem(CLE_FLAG);localStorage.setItem("qq_v",String(v));
      }
    }catch(e){}
  }
  if(flag()) dejaRepondu();
  else if(lire().length>0) question(lire().length); // reprise si rechargement en cours de route
  else accueil();
}
demarrer();
</script>
